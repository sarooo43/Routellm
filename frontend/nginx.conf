server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path serves index.html so client-side
    # routes like /analytics work on hard refresh / direct entry.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the fingerprinted build assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
