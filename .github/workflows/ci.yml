name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    # Runs first and finishes in seconds: a leaked credential in the tree OR in
    # history fails the build before anything is installed. Findings are
    # masked, so the CI log never repeats a secret.
    name: No credentials in tree or history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The history scan needs the real history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan working tree and git history
        run: python backend/scripts/check_secrets.py

  backend-tests:
    needs: secret-scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # run.py accepts 3.11+, so both ends of that promise are tested. The
        # lower bound matters most: it is what an older distro ships.
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: routellm
          POSTGRES_PASSWORD: routellm
          POSTGRES_DB: routellm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routellm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install backend dependencies
        # Runtime + test tooling is split so the deployment install stays
        # minimal; CI needs the dev set (pytest, aiosqlite, respx, openai).
        run: pip install -r requirements-dev.txt

      - name: Verify the app imports with no environment configured
        # Guards the deployment invariant: `import app.main` must never
        # require DATABASE_URL/REDIS_URL/gradio.
        run: python -c "import app.main, app.db.session; print('import ok')"
        env:
          DATABASE_URL: ""
          REDIS_URL: ""

      - name: Verify the one-command launcher (no server started)
        # --check validates Python, venv, requirements, dist and ports without
        # binding anything, so it is safe to run in CI.
        run: python run.py --check
        working-directory: .

      - name: Verify the Hugging Face entrypoint imports
        run: python -c "import hf_app; print('hf_app modes:', hf_app.STATUS_UI_PATH)"
        env:
          DATABASE_URL: ""
          REDIS_URL: ""

      - name: Run backend tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://routellm:routellm@localhost:5432/routellm_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest --cov=app --cov-report=term-missing

  slow-tests:
    # The default `pytest` run deselects @pytest.mark.slow (pytest.ini:
    # addopts = -m "not slow") because the git-history secret scan walks every
    # blob in the object database and grows with history. This job is the other
    # half of that bargain: the slow tests still run, on every push and PR,
    # with FULL history so the scan sees the real object graph rather than a
    # shallow clone that would pass trivially.
    needs: secret-scan
    name: Slow tests (history depth)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the slow tests
        run: pytest -m slow -q

  python-newer:
    # T8f: the owner runs Python 3.14.2 in a Codespace while CI covers 3.11 and
    # 3.12. 3.13/3.14 are NOT documented as supported — this job only reports.
    # continue-on-error keeps a transient interpreter/dependency problem from
    # blocking a PR, and a real incompatibility shows up as a red-but-allowed
    # job we can read instead of a surprise for the owner.
    needs: secret-scan
    name: backend-tests (3.13, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify the app imports
        run: python -c "import app.main; print('import ok')"
        env:
          DATABASE_URL: ""
          REDIS_URL: ""

      - name: Run backend tests (informational)
        run: pytest -q

  hf-space-boot:
    # Proves the Space's actual start command works: `python hf_app.py` must
    # serve /health, /docs, /ui, /api/v1/models and /api/v1/catalog on 7860
    # with no database, no Redis and no Gradio-specific glue.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Install gradio exactly as Hugging Face does and check resolution
        # IMPORTANT: Hugging Face does NOT run a bare `pip install gradio`.
        # For the Gradio SDK it installs
        #   gradio[oauth,mcp]==<sdk_version>  +  spaces  +  uvicorn  +  websockets
        # and the *mcp* extra has a tighter pydantic ceiling than a bare
        # install does. Appending a stub `torch` (already on the Space image)
        # reproduces the Space's resolution faithfully without a 2GB download.
        run: |
          SDK_VERSION=$(python -c "import re;print(re.search(r'^sdk_version:\s*(\S+)',open('README.md').read(),re.M).group(1))")
          echo "Resolving against gradio[oauth,mcp]==${SDK_VERSION}"
          pip install "torch-stub==0.0.1" || true
          pip install -r requirements.txt \
            "gradio[oauth,mcp]==${SDK_VERSION}" \
            "spaces==0.51.3" \
            "uvicorn>=0.14.0" "websockets>=10.4"
          pip check
          python -c "import gradio, fastapi, starlette, pydantic; print('gradio', gradio.__version__); print('fastapi', fastapi.__version__); print('starlette', starlette.__version__); print('pydantic', pydantic.VERSION)"

      - name: Verify the pins satisfy gradio's enabled extras
        run: ROUTELLM_CHECK_PYPI=1 python -m pytest tests/test_hf_requirements.py -q
        env:
          DATABASE_URL: ""
          REDIS_URL: ""

      - name: Boot hf_app.py and probe every public path
        env:
          DATABASE_URL: ""
          REDIS_URL: ""
          PORT: "7860"
        run: |
          set -euo pipefail
          python hf_app.py > /tmp/hf_app.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf --max-time 3 http://127.0.0.1:7860/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          echo "--- /health ---"; cat /tmp/health.json
          python - <<'PY'
          import json, sys
          body = json.load(open("/tmp/health.json"))
          assert body["status"] in {"ok", "degraded"}, body
          for key in ("status", "db", "redis", "version", "uptime_s", "components"):
              assert key in body, f"missing {key} in /health: {body}"
          print("health contract ok")
          PY
          # / must redirect (307/308), /docs and /ui must answer 2xx/3xx.
          for path in / /docs /ui /api/v1/models /api/v1/catalog /v1/models; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:7860$path")
            echo "$path -> $code"
            case "$code" in
              200|307|308) ;;
              *) echo "unexpected status for $path"; exit 1 ;;
            esac
          done
          echo "--- startup log (masked) ---"
          grep -E "hf_app_ready|startup_configuration|database_schema" /tmp/hf_app.log || true

      - name: Boot with 7860 briefly held, as on ZeroGPU
        # The Space once failed with "[Errno 98] address already in use" on
        # 7860 while everything else had started. A one-shot port probe turned
        # that into a restart loop; ROUTELLM_PORT_WAIT_S lets the app wait for
        # the (usually transient) holder to go away. This reproduces the real
        # condition: a stand-in process owns 7860 for 3 seconds first.
        env:
          DATABASE_URL: ""
          REDIS_URL: ""
          PORT: "7860"
          ROUTELLM_PORT_WAIT_S: "20"
        run: |
          set -euo pipefail
          python - <<'PY' &
          import socket, time
          s = socket.socket()
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(("0.0.0.0", 7860)); s.listen(1)
          time.sleep(3); s.close()
          PY
          HOLDER=$!
          sleep 0.5
          python hf_app.py > /tmp/hf_app_held.log 2>&1 &
          APP=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -sf --max-time 3 http://127.0.0.1:7860/health > /tmp/held_health.json; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "--- app log ---"; cat /tmp/hf_app_held.log
            echo "app did not recover once the port was released"
            exit 1
          fi
          echo "recovered after the holder released 7860:"
          cat /tmp/held_health.json; echo
          grep -E "hf_app_ready|hf_app_port_unavailable" /tmp/hf_app_held.log || true
          kill "$APP" 2>/dev/null || true
          wait "$APP" 2>/dev/null || true

      - name: Run the deployment smoke script against the local server
        # cwd is backend/, so the script is at ../scripts/. Routing checks are
        # skipped here (no provider keys in CI); CI's job is the HTTP contract.
        run: python ../scripts/smoke_deployed.py --api http://127.0.0.1:7860 --skip-routing

  cloudflare-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --include=dev

      - name: Test Cloudflare Worker and config
        run: npm run test:cloudflare

      - name: Build dashboard
        run: npm run build

      - name: Validate Wrangler deploy config
        run: npm run deploy:dry-run

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Explicit LTS patch pin. undici 8 (pulled in by jsdom 30) requires
          # Node >= 22.19.0 (zstd in node:zlib), and vitest 5 / jsdom 30 drop
          # Node 20 entirely — see frontend/package.json engines.
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Type-check and lint
        run: |
          npx tsc -b
          npx oxlint src

      - name: Build the dashboard
        # The launcher serves frontend/dist; a build failure must be caught in
        # CI rather than by a user whose `python run.py` opens an empty page.
        run: npx vite build
