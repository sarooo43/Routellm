# RouteLLM — optional single-service container.
#
# The supported local path needs no Docker at all:
#
#   python run.py
#
# This file is for people who prefer a container, or want to run it on a home
# server. It runs ONE service: the backend, which also serves the built
# dashboard. No Postgres, no Redis, no Caddy.
#
#   docker compose up --build
#   # http://localhost:8000
#
# Provider keys go on the Providers page in the UI (encrypted at rest with a
# key generated into the /data volume) or in an optional .env file next to
# this one — see backend/.env.example.
#
# EXPOSURE: the port is published on 127.0.0.1 only, so nothing on your
# network can reach it. Change to "8000:8000" deliberately if you want that.

services:
  routellm:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Same-origin: the backend serves the bundle it ships.
        VITE_API_BASE_URL: ""
    image: routellm:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # SQLite database, generated encryption key, logs. Named volume, so data
      # survives `docker compose down` (but not `down -v`).
      - routellm-data:/data
    environment:
      # Uncomment to pin configuration instead of using backend/.env:
      # ROUTELLM_DATA_DIR: /data
      # DATABASE_URL: postgresql://user:password@host:5432/routellm
      # REDIS_URL: redis://host:6379/0
      # REQUIRE_API_KEY: "true"
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  routellm-data:
