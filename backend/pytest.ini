[pytest]
asyncio_mode = auto
testpaths = tests
; Pin the loop scope explicitly (silences the pytest-asyncio deprecation
; warning and documents the per-function event loop that the DB-engine reset
; fixture in tests/integration/conftest.py relies on).
asyncio_default_fixture_loop_scope = function

; ---------------------------------------------------------------------------
; Slow tests are DESELECTED by default (T8b).
;
; The git-history secret scan walks every blob in the object database. It is
; the only test that grows without bound as history grows, and it was 2.8 s of
; a 28 s suite on the machine this was measured on. Keeping it in the default
; run punishes every small change; dropping it entirely would hide the one
; check whose whole point is that it cannot be skipped by accident.
;
; So: excluded here, and run by its own CI job with fetch-depth: 0
;   pytest -m slow
; ---------------------------------------------------------------------------
addopts = -m "not slow"

markers =
    slow: walks the full git object database (history secret scan); excluded from the default run, exercised by the `-m slow` CI job
